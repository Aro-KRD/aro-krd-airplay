name: Release

# Trigger on any tag push, manual trigger, or when a release is published via UI
on:
  push:
    tags:
      - 'v*'
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.0 or arokrd)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Version and tag resolution
        id: ver
        shell: powershell
        run: |
          $rawTag = "${{ github.event.inputs.tag }}"
          if (-not $rawTag) { $rawTag = "${{ github.event.release.tag_name }}" }
          if (-not $rawTag) { $rawTag = "${{ github.ref_name }}" }
          if (-not $rawTag -or $rawTag -eq "main" -or $rawTag -eq "master") { $rawTag = "v1.0.0" }

          $v = $rawTag.TrimStart('v')
          if ($v -notmatch '^\d+(\.\d+)+') {
            $v = "1.0.0"
          }
          Write-Host "Target tag: $rawTag"
          Write-Host "Version: $v"
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows executable
        shell: powershell
        run: |
          .\make-exe.bat nopause

      - name: Build installer
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after install attempt.' }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\pcairplay.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Zip the binaries and scripts (portable package)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $files = 'AirBridge.exe', 'AirPlayPC.exe', 'run.bat', 'AirBridge.bat',
                   'uxplay-common.ps1', 'setup.ps1', 'start-airplay.ps1',
                   'airplay-ui.ps1', 'frame-mirror.ps1', 'doctor.ps1',
                   'aro-krd-airplay.vbs', 'aro-krd-airplay.cmd', 'Diagnostics.cmd',
                   'Framed Mirror.cmd', 'README.md', 'LICENSE', 'pcairplay.ico', 'logo.png'
          Compress-Archive -Path $files -DestinationPath "AirBridge-${{ steps.ver.outputs.version }}.zip"

      - name: Archive the Arch Linux port
        shell: bash
        run: |
          tar -czf "aro-krd-airplay-${{ steps.ver.outputs.version }}-arch.tar.gz" \
            arch setup.sh start-airplay.sh doctor.sh aro-krd-airplay.sh aro-krd-airplay-Control.sh AirBridge.sh AirBridge-Control.sh AirPlayPC.sh AirPlayPC-Control.sh README.md LICENSE

      - name: SHA256SUMS
        shell: powershell
        run: |
          $items = @(Get-Item installer\Output\*.exe) + @(Get-Item AirBridge.exe) + @(Get-Item *.zip) + @(Get-Item *-arch.tar.gz -ErrorAction SilentlyContinue)
          $lines = foreach ($f in $items) {
            '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name
          }
          $lines | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish assets to GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $targetTag = "${{ steps.ver.outputs.tag }}"
          $assets = @(Get-Item installer\Output\*.exe) + @(Get-Item AirBridge.exe) + @(Get-Item *.zip) + @(Get-Item *-arch.tar.gz -ErrorAction SilentlyContinue) + @(Get-Item SHA256SUMS.txt)
          $assetPaths = $assets | ForEach-Object { $_.FullName }

          Write-Host "Target tag is: $targetTag"
          Write-Host "Assets to publish:"
          $assetPaths | ForEach-Object { Write-Host "  - $_" }

          gh release view $targetTag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $targetTag already exists. Uploading assets..."
            gh release upload $targetTag @assetPaths --clobber
          } else {
            Write-Host "Creating release $targetTag..."
            gh release create $targetTag @assetPaths --title "AirBridge ${{ steps.ver.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
